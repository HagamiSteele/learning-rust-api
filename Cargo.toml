[package]
name = "trades-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
rust_decimal = "1.43.0"
sqlx = {version = "0.9.0", features = ["postgres", "chrono", "rust_decimal", "runtime-tokio", "tls-rustls"]}
tokio = {version = "1.54.1", features = ["rt-multi-thread", "macros"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
