services:
  postgres:
    image: postgres:16
    container_name: trades-postgres
    environment:
      POSTGRES_USER: trades
      POSTGRES_PASSWORD: trades
      POSTGRES_DB: EpexM7
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trades -d EpexM7"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
